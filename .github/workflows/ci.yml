name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y git python3 shellcheck tmux
      - name: Syntax, ShellCheck and isolated launcher regressions
        run: scripts/check.sh
      - name: Product site links, metadata and brand handoff
        run: python3 scripts/check-site.py && node --check site/app.js
