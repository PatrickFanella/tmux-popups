name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y python3 shellcheck tmux
      - name: Syntax, ShellCheck and isolated launcher regressions
        run: scripts/check.sh
