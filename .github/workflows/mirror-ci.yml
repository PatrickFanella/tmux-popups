name: Mirror CI
run-name: Mirror CI ${{ github.sha }}

# Pull request verification. GitHub subculture-collective is the source: this
# runs on every pushed branch except main, and branch protection requires
# "Mirror CI gate" before a pull request can merge. Kvant mirrors main to
# Gitea, where .gitea/workflows run the main-branch jobs.
'on':
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    if: github.repository == 'subculture-collective/tmux-popups'
    runs-on: ubuntu-24.04
    # Same image as the Gitea job, so tmux, ShellCheck and Python versions match.
    container: node:24-bookworm-slim
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install verification tools
        run: apt-get update && apt-get install -y --no-install-recommends git python3 shellcheck tmux
      - name: Syntax, ShellCheck and isolated launcher regressions
        run: scripts/check.sh
      - name: Product site links, metadata and brand handoff
        run: python3 scripts/check-site.py && node --check site/app.js

  gate:
    name: Mirror CI gate
    if: always() && github.repository == 'subculture-collective/tmux-popups'
    needs:
      - shell
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {'shell'}
          assert set(results) == expected, results
          for name, result in results.items():
              assert result["result"] == "success", name + " did not pass"
          PY
