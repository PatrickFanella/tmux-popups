services:
  tmux-popups-site:
    image: ${TMUX_POPUPS_SITE_IMAGE:?Set the tmux-popups site image}
    container_name: tmux-popups-site
    networks: [projects]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      tv.subcult.source-revision: ${TMUX_POPUPS_SITE_REVISION:?Set the source revision}
networks:
  projects:
    external: true
