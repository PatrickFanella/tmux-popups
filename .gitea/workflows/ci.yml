name: Launcher verification

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only main pushes run here; keep each main commit's result.
  cancel-in-progress: false

jobs:
  shell:
    runs-on: ubuntu-latest
    container: node:24-bookworm-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        run: apt-get update && apt-get install -y --no-install-recommends git python3 shellcheck tmux
      - name: Syntax, ShellCheck and isolated launcher regressions
        run: scripts/check.sh
      - name: Product site links, metadata and brand handoff
        run: python3 scripts/check-site.py && node --check site/app.js
