name: Launcher verification

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    container: node:24-bookworm-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        run: apt-get update && apt-get install -y --no-install-recommends python3 shellcheck tmux
      - name: Syntax, ShellCheck and isolated launcher regressions
        run: scripts/check.sh
